[package]
name = "luuluong-update"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
thiserror = "1"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sha2 = ">=0.10"
zip = { version = ">=2", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1"
