[package]
name = "app"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
luuluong-core = { path = "../core" }
eframe = { version = ">=0.30", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
luuluong-weather = { path = "../weather" }
luuluong-logger = { path = "../logger" }
directories = "5"
egui_plot = ">=0.32"
chrono = { version = "0.4", default-features = false, features = ["std"] }
luuluong-storage = { path = "../storage" }

# Chỉ chạy khi build cho Windows: gắn biểu tượng vào file .exe (đặc tả mục 9).
[build-dependencies]
winresource = "0.1"
