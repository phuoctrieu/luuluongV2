[package]
name = "luuluong-weather"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
mockito = "1"
